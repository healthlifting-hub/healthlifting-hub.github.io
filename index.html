<script>
// Guarda la sesión de la app en este dispositivo para no pedir el código cada vez.
(function () {
  var K = 'hl_token';
  window.addEventListener('message', function (ev) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(ev.origin)) return;
    var d = ev.data;
    if (!d || d.hl !== 1) return;
    try {
      if (d.op === 'get') ev.source.postMessage({ hl: 'token', token: localStorage.getItem(K) }, ev.origin);
      else if (d.op === 'set' && typeof d.token === 'string' && /^[a-f0-9]{40,80}$/.test(d.token)) localStorage.setItem(K, d.token);
      else if (d.op === 'del') localStorage.removeItem(K);
    } catch (e) {}
  });
})();
</script>
